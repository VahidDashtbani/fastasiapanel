<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0f172a">
<title>FastAsiaPanel</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 9h12v3.5h-8v3h6.5V19H14v5h-4V9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="logo">F</span>
      <div class="brand-txt">
        <strong>FastAsiaPanel</strong>
        <small>Xray Core Management</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button type="button" data-page="dashboard" class="on">Dashboard</button>
      <button type="button" data-page="inbounds">Inbounds</button>
      <button type="button" data-page="clients">Clients</button>
      <button type="button" data-page="outbounds">Outbounds</button>
      <button type="button" data-page="routing">Routing Rules</button>
      <button type="button" data-page="quotas">Quota Groups</button>
      <button type="button" data-page="nodes">Nodes & API</button>
      <button type="button" data-page="logs">Logs & Xray Config</button>
      <button type="button" data-page="settings">Settings & System</button>
      <a class="nav-ext-link" href="https://fastasian.website/doc" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;justify-content:space-between;text-decoration:none;"><span>API Docs</span><span style="opacity:.7;font-size:12px;">↗</span></a>
    </nav>
    <div class="side-foot">
      <button class="ghost" id="themeBtn" type="button">Toggle Theme</button>
      <button class="ghost danger-ghost" id="logoutBtn" type="button">Sign Out</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="title">Dashboard</h1>
      <div id="topActions"></div>
    </header>
    <div id="view" class="view"></div>

</main>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script src="static/app.js"></script>

<div id="outboundEditModal" class="modal-backdrop hidden" style="position:fixed;inset:0;background:rgba(4,7,18,0.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;">
  <div class="card" style="width:min(680px,94vw);max-height:88vh;overflow:auto;padding:20px;border:1px solid rgba(129,140,248,0.35);border-radius:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3 style="margin:0;">Edit Outbound</h3>
      <button type="button" id="closeOutboundEditModal" class="btn btn-secondary" style="padding:4px 10px;">✕</button>
    </div>
    <form id="outboundEditForm" style="display:grid;gap:12px;">
      <input type="hidden" id="editOutboundIndex" />
      <label style="display:grid;gap:6px;">
        <span>Tag</span>
        <input type="text" id="editOutboundTag" required style="padding:8px 10px;border-radius:8px;" />
      </label>
      <label style="display:grid;gap:6px;">
        <span>Protocol</span>
        <input type="text" id="editOutboundProtocol" required style="padding:8px 10px;border-radius:8px;" />
      </label>
      <label style="display:grid;gap:6px;">
        <span>Outbound JSON Config</span>
        <textarea id="editOutboundJson" rows="12" style="width:100%;font-family:monospace;padding:10px;border-radius:8px;"></textarea>
      </label>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
        <button type="button" id="cancelOutboundEditBtn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Outbound</button>
      </div>
    </form>
  </div>
</div>


<div id="fapQrModal" class="modal-backdrop hidden" style="position:fixed;inset:0;background:rgba(4,7,18,0.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;">
  <div class="card" style="width:min(460px,94vw);padding:20px;border:1px solid rgba(129,140,248,0.4);border-radius:16px;display:grid;gap:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 id="fapQrTitle" style="margin:0;">QR Code</h3>
      <button type="button" id="fapQrCloseBtn" class="btn btn-secondary" style="padding:4px 10px;">✕</button>
    </div>

    <div style="display:flex;gap:8px;">
      <button type="button" id="fapQrTabConfig" class="btn btn-primary" style="flex:1;">Config</button>
      <button type="button" id="fapQrTabSub" class="btn btn-secondary" style="flex:1;">Subscription</button>
    </div>

    <div id="fapQrCanvasBox" style="display:flex;align-items:center;justify-content:center;min-height:220px;background:#ffffff;border-radius:12px;padding:12px;"></div>

    <div style="display:grid;gap:6px;">
      <label id="fapQrValueLabel" style="font-size:12px;opacity:0.85;">Value</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="fapQrValueInput" readonly style="flex:1;padding:8px 10px;border-radius:8px;font-family:monospace;font-size:12px;" />
        <button type="button" id="fapQrCopyBtn" class="btn btn-secondary">Copy</button>
      </div>
    </div>
  </div>
</div>


<div id="fapQrModal" style="position:fixed;inset:0;background:rgba(4,7,18,0.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1200;">
  <div style="width:min(420px,92vw);background:#0d1326;color:#f8fafc;border:1px solid rgba(129,140,248,0.4);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,0.65);">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong id="fapQrTitle" style="font-size:15px;">QR Code</strong>
      <button type="button" id="fapQrCloseBtn" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:4px 10px;cursor:pointer;">✕</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button type="button" id="fapQrTabConfig" style="padding:7px 10px;border-radius:8px;border:1px solid rgba(129,140,248,0.5);background:#4f46e5;color:#fff;cursor:pointer;font-size:12px;font-weight:600;">Config</button>
      <button type="button" id="fapQrTabSub" style="padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#cbd5e1;cursor:pointer;font-size:12px;font-weight:600;">Subscription</button>
    </div>

    <div style="display:flex;justify-content:center;align-items:center;padding:12px;background:#ffffff;border-radius:12px;">
      <div id="fapQrCanvasBox" style="width:184px;height:184px;display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>
    </div>

    <div style="display:grid;gap:6px;">
      <span id="fapQrValueLabel" style="font-size:12px;color:#94a3b8;">Config Link</span>
      <div style="display:flex;gap:8px;">
        <input type="text" id="fapQrValueInput" readonly style="flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.16);background:#070b17;color:#e2e8f0;font-family:monospace;font-size:11px;" />
        <button type="button" id="fapQrCopyBtn" style="padding:8px 12px;border-radius:8px;border:1px solid rgba(129,140,248,0.45);background:rgba(79,70,229,0.25);color:#fff;cursor:pointer;font-size:12px;">Copy</button>
      </div>
    </div>
  </div>
</div>
<!-- /fapQrModal -->

</body>
</html>
