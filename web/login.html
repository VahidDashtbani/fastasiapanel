<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120f"><title>ورود | FastAsiaPanel</title><link rel="stylesheet" href="/assets.css"></head><body class="login-page"><main class="login-shell"><div class="brand-mark">F<span>A</span></div><div class="eyebrow">FASTASIA / CONTROL CENTER</div><h1>خوش برگشتی.</h1><p class="muted">برای مدیریت سرور وارد حساب خودت شو.</p><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><div id="error" class="error" role="alert"></div><button class="primary wide">ورود به پنل <span>←</span></button></form><div class="login-foot"><i></i> اتصال امن به FastAsiaPanel</div></main><script>const form=document.querySelector('#loginForm');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('./api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'ورود ناموفق بود');location.href='./'}catch(e){document.querySelector('#error').textContent=e.message;b.disabled=false}})</script></body></html>
