<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>FastAsiaPanel — Sign In</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body class="login-body">
<form class="login-card" id="loginForm">
  <div class="brand big"><span class="logo">F</span><strong>FastAsiaPanel</strong></div>
  <label>Username<input class="ltr" name="username" autocomplete="username" required autofocus></label>
  <label>Password<input class="ltr" name="password" type="password" autocomplete="current-password" required></label>
  <div class="form-error" id="loginErr" role="alert"></div>
  <button class="btn" type="submit">Sign In</button>
</form>
<script src="static/login.js"></script>
</body>
</html>
