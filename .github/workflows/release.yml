name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ""
            suffix: linux-amd64
          - goarch: arm64
            goarm: ""
            suffix: linux-arm64
          - goarch: arm
            goarm: "7"
            suffix: linux-armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          go build -ldflags="-checklinkname=0 -s -w -X main.panelVersion=${GITHUB_REF_NAME#v}" -o fastasiapanel .

      - name: Package
        run: tar -czf fastasiapanel-${{ matrix.suffix }}.tar.gz fastasiapanel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastasiapanel-${{ matrix.suffix }}
          path: fastasiapanel-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true