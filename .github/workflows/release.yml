name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            suffix: linux-amd64
          - goarch: arm64
            goarm: ''
            suffix: linux-arm64
          - goarch: arm
            goarm: '7'
            suffix: linux-armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./... && go vet ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o fastasiapanel ./cmd/panel
      - name: Package
        run: tar -czf fastasiapanel-${{ matrix.suffix }}.tar.gz fastasiapanel web
      - uses: softprops/action-gh-release@v2
        with:
          files: fastasiapanel-${{ matrix.suffix }}.tar.gz
          generate_release_notes: true
