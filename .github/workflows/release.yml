name: Release FastAsiaPanel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package archives
        run: |
          mkdir -p dist
          for ARCH in amd64 arm64; do
            PKG_DIR="build_${ARCH}/fastasiapanel"
            mkdir -p "${PKG_DIR}/bin"

            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build -ldflags="-s -w" -o "${PKG_DIR}/fastasiapanel" ./cmd/panel

            if [ -d "scripts" ]; then
              cp -r scripts "${PKG_DIR}/"
            fi

            tar -czf "dist/fastasiapanel-linux-${ARCH}.tar.gz" -C "build_${ARCH}" fastasiapanel
            (cd dist && sha256sum "fastasiapanel-linux-${ARCH}.tar.gz" > "fastasiapanel-linux-${ARCH}.tar.gz.sha256")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fastasiapanel-linux-*.tar.gz
            dist/fastasiapanel-linux-*.tar.gz.sha256
          generate_release_notes: true
